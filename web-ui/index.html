<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Plumber — 拓扑图可视化</title>
    <style>
      /* ── Design tokens: terminal-native monochrome（v0.7 设计系统提案落地）── */
      :root {
        /* Surfaces：画布纯黑舞台，chrome 灰阶层差拉开 */
        --bg: #000000;
        --bg-chrome: #0a0a0a;
        --surface-1: #141414;
        --surface-2: #1e1e1e;
        --surface-3: #2a2a2a;

        /* Ink（白阶梯：文本最低档 0.52 ≈ 5.7:1，全部 ≥ AA） */
        --ink: #ffffff;
        --ink-muted: rgba(255, 255, 255, 0.72);
        --ink-faint: rgba(255, 255, 255, 0.52);

        /* Lines & borders */
        --line: rgba(255, 255, 255, 0.09);
        --line-strong: rgba(255, 255, 255, 0.16);

        /* 交互色（推荐：白）。focus/选中/开关一律明度表达 */
        --interactive: #ffffff;

        /* Status colors — 画布上唯一的彩色语义（OKLCH-tuned for black）*/
        --status-pending: #8a8f98;
        --status-ready: #4a93e8;
        --status-running: #f0a73a;
        --status-passed: #34c964;
        --status-failed: #e5504f;
        --status-blocked: #a574e6;
        --status-cancelled: #7e848d; /* v0.7 提亮（原 #5b5f66 仅 3.27:1）*/

        /* Fonts */
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        --font-mono:
          ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

        /* Type scale（--text-2xs 提至 11px：废除 10px 功能文本）*/
        --text-2xs: 0.6875rem; /* 11px */
        --text-xs: 0.75rem; /* 12px */
        --text-sm: 0.8125rem; /* 13px */
        --text-base: 0.875rem; /* 14px */
        --text-md: 1rem; /* 16px */
        --text-lg: 1.25rem; /* 20px */
        --text-xl: 1.75rem; /* 28px */

        /* Letter-spacing scale */
        --track-tight: -0.015em;
        --track-body: 0.01em;
        --track-label: 0.04em;
        --track-caps: 0.08em;

        /* Spacing (4pt base) */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;
        --sp-8: 32px;
        --sp-10: 40px;
        --sp-12: 48px;
        --sp-16: 64px;

        /* Radii（上限 10px）*/
        --r-sm: 3px;
        --r: 6px;
        --r-lg: 10px;

        /* Easings */
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

        /* z-index scale（v0.7 归位：工具轨/浮层 10 < 面板 100 < tooltip 1000）*/
        --z-canvas: 1;
        --z-overlay: 10;
        --z-panel: 100;
        --z-tooltip: 1000;

        /* 布局常量 */
        --header-h: 76px; /* 两排顶栏总高 */
        --rail-w: 44px; /* 左缘工具轨宽 */

        /* Touch targets */
        --tap: 44px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: var(--bg-chrome);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings:
          "tnum" 1,
          "lnum" 1;
      }

      /* 键盘焦点全局可见（白环；鼠标点击不触发）*/
      :focus-visible {
        outline: 2px solid var(--interactive);
        outline-offset: 1px;
      }

      body {
        letter-spacing: var(--track-body);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-3);
        border-radius: var(--r-sm);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      /* Selection */
      ::selection {
        background: rgba(255, 255, 255, 0.12);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!--
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
      FORM: replacement world, direction pinned by user review of docs/design-system/preview.html (A+C 画布优先); code-led build (no image generation in harness).
      THESIS: 色彩即状态，交互用明度——画布上唯一的彩色是 7 个节点状态语义，一切交互态用白色明度阶梯表达；chrome 让位于画布（两排顶栏 + 统一工具轨），拒绝通用 dashboard 套皮与彩虹编码。
      OWN-WORLD: 纯黑画布舞台 #000 + 中性灰阶 chrome（0a/14/1e）；ink 白阶梯 100/72/52%（文本下限 4.6:1）；状态色七值（cancelled 提亮 #7e848d）；mono 只为 id/数字/命令，UI 标签 sans；3/6/10px 圆角；130/220/450ms 单一 ease-out 曲线；图标全部内联 SVG。
      STORY: 开发者挂屏审阅任务拓扑——一眼看到 running 在哪、点两下看到任何细节、每个空态给出路；Esc 与空白点击是全局退出手势。
      FIRST VIEWPORT: 两排顶栏（品牌+可点状态 chips / 图 tab+层级+搜索）约 76px，左缘 44px 工具轨（透镜/决策/版本/缩放/专注），其余全部让给画布；fit 挂接模拟收敛，首屏约 1s 内取景完成。
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

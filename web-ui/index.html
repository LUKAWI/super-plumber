<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Plumber — 拓扑图可视化</title>
    <style>
      /* ── Design tokens: terminal-native monochrome ── */
      :root {
        /* Surfaces (black → layered neutrals) */
        --bg: #000000;
        --surface-1: #0a0a0a;
        --surface-2: #121212;
        --surface-3: #1a1a1a;

        /* Ink (white hierarchy) */
        --ink: #ffffff;
        --ink-muted: rgba(255, 255, 255, 0.62);
        --ink-faint: rgba(255, 255, 255, 0.38);

        /* Lines & borders (white at low opacity) */
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);

        /* Status colors — only color in UI (OKLCH-tuned for black) */
        --status-pending: #8a8f98;
        --status-ready: #4a93e8;
        --status-running: #f0a73a;
        --status-passed: #34c964;
        --status-failed: #e5504f;
        --status-blocked: #a574e6;
        --status-cancelled: #5b5f66;

        /* Fonts */
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --font-mono:
          ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

        /* Type scale (rem, ~1.25 ratio, product UI compact) */
        --text-2xs: 0.625rem; /* 10px */
        --text-xs: 0.75rem; /* 12px */
        --text-sm: 0.8125rem; /* 13px */
        --text-base: 0.875rem; /* 14px */
        --text-md: 1rem; /* 16px */
        --text-lg: 1.25rem; /* 20px */
        --text-xl: 1.75rem; /* 28px */

        /* Letter-spacing scale */
        --track-tight: -0.015em;
        --track-body: 0.01em;
        --track-label: 0.04em;
        --track-caps: 0.08em;

        /* Spacing (4pt base) */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;
        --sp-8: 32px;
        --sp-10: 40px;
        --sp-12: 48px;
        --sp-16: 64px;

        /* Radii */
        --r-sm: 3px;
        --r: 6px;
        --r-lg: 10px;

        /* Easings */
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

        /* z-index scale */
        --z-canvas: 1;
        --z-overlay: 10;
        --z-panel: 100;
        --z-tooltip: 1000;

        /* Touch targets */
        --tap: 44px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings:
          "tnum" 1,
          "lnum" 1;
      }

      /* Light-on-dark compensation (per typeset reference) */
      body {
        letter-spacing: var(--track-body);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-3);
        border-radius: var(--r-sm);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      /* Selection */
      ::selection {
        background: rgba(255, 255, 255, 0.12);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Integrations gen completeness (integrations/src -> .pi / integrations/plugin / shared)
        run: node scripts/sync-integrations.mjs --check
      - name: Build backend (dist/ required by CLI/MCP tests)
        run: npm run build
      - name: Roadmap domain-view drift
        run: node dist/cli/index.js export --docs --check --graph roadmap-to-1-0-0
      - name: Q1 next/validate scale benchmark
        run: node scripts/perf/q1-next-validate.mjs --sizes 1000,10000 --samples 5 --baseline scripts/perf/q1-next-validate-baseline.json --check
      - name: Typecheck backend
        run: npm run typecheck
      - name: Backend unit tests
        run: npm test
      - name: Install web-ui deps
        run: npm ci
        working-directory: web-ui
      - name: Typecheck web-ui (svelte-check)
        run: npm run typecheck
        working-directory: web-ui
      - name: Build web-ui
        run: npm run build
        working-directory: web-ui
      - name: Web-ui unit tests
        run: npm test
        working-directory: web-ui
